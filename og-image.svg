<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk', Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3fd"/>
      <stop offset="1" stop-color="#dcecfb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#12233a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#0466c8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0466c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand -->
  <rect x="92" y="86" width="18" height="18" rx="5" fill="#0466c8"/>
  <text x="122" y="102" font-size="26" font-weight="700" fill="#0a0a0a">azil.ma</text>

  <!-- headline -->
  <text x="90" y="250" font-size="70" font-weight="700" fill="#0a0a0a" letter-spacing="-1">Your business card</text>
  <text x="90" y="326" font-size="70" font-weight="700" fill="#0466c8" letter-spacing="-1">that never runs out.</text>
  <text x="94" y="386" font-size="27" fill="#5b6472">One tap shares your contact, socials or catalog — on any phone.</text>

  <!-- pills -->
  <g font-size="22" font-weight="600">
    <rect x="92"  y="430" width="130" height="50" rx="25" fill="#0466c8"/>
    <text x="157" y="462" text-anchor="middle" fill="#fff">One tap</text>
    <rect x="238" y="430" width="130" height="50" rx="25" fill="none" stroke="#0466c8" stroke-width="1.5"/>
    <text x="303" y="462" text-anchor="middle" fill="#0466c8">No app</text>
    <rect x="384" y="430" width="250" height="50" rx="25" fill="none" stroke="#0466c8" stroke-width="1.5"/>
    <text x="509" y="462" text-anchor="middle" fill="#0466c8">Made in Morocco</text>
  </g>

  <!-- NFC card + broadcast waves + phone -->
  <g transform="rotate(-9 940 315)">
    <rect x="800" y="215" width="290" height="182" rx="18" fill="url(#card)"/>
    <rect x="828" y="243" width="42" height="32" rx="6" fill="#0466c8"/>
    <text x="828" y="367" font-size="20" font-weight="700" fill="#fff">Ilias — azil.ma</text>
    <!-- broadcast waves from the chip -->
    <g fill="none" stroke="#0466c8" stroke-width="2.5" opacity="0.85">
      <path d="M884 259 a26 26 0 0 1 0 0" />
      <circle cx="849" cy="259" r="36" opacity="0.5"/>
      <circle cx="849" cy="259" r="54" opacity="0.32"/>
      <circle cx="849" cy="259" r="72" opacity="0.18"/>
    </g>
  </g>
  <!-- mini phone showing saved contact -->
  <g transform="rotate(6 1090 430)">
    <rect x="1055" y="360" width="86" height="170" rx="16" fill="#0c0d13" stroke="#05060a" stroke-width="4"/>
    <rect x="1063" y="368" width="70" height="154" rx="11" fill="#eaf3fd"/>
    <circle cx="1098" cy="410" r="15" fill="#0466c8"/>
    <rect x="1078" y="435" width="40" height="7" rx="3.5" fill="#0a0a0a"/>
    <rect x="1082" y="448" width="32" height="6" rx="3" fill="#8a93a4"/>
    <rect x="1078" y="470" width="40" height="18" rx="9" fill="#0a0a0a"/>
  </g>
</svg>
