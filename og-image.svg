<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk', Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3fd"/>
      <stop offset="1" stop-color="#dcecfb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0466c8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0466c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand -->
  <rect x="92" y="86" width="18" height="18" rx="5" fill="#0466c8"/>
  <text x="122" y="102" font-size="26" font-weight="700" fill="#0a0a0a">azil.ma</text>

  <!-- headline -->
  <text x="92" y="250" font-size="72" font-weight="700" fill="#0a0a0a" letter-spacing="-1">Your business card</text>
  <text x="92" y="330" font-size="72" font-weight="700" fill="#0466c8" letter-spacing="-1">that never runs out.</text>
  <text x="94" y="392" font-size="28" fill="#5b6472">One tap shares your contact, socials or catalog — on any phone.</text>

  <!-- pill row -->
  <g font-size="22" font-weight="600">
    <rect x="92"  y="440" width="180" height="50" rx="25" fill="#0466c8"/>
    <text x="182" y="472" text-anchor="middle" fill="#fff">Tap. Share.</text>
    <rect x="288" y="440" width="150" height="50" rx="25" fill="none" stroke="#0466c8" stroke-width="1.5"/>
    <text x="363" y="472" text-anchor="middle" fill="#0466c8">No app</text>
    <rect x="454" y="440" width="240" height="50" rx="25" fill="none" stroke="#0466c8" stroke-width="1.5"/>
    <text x="574" y="472" text-anchor="middle" fill="#0466c8">Made in Morocco</text>
  </g>

  <!-- floating NFC card visual -->
  <g transform="rotate(-8 960 300)">
    <rect x="820" y="200" width="290" height="182" rx="18" fill="url(#card)"/>
    <rect x="848" y="228" width="42" height="32" rx="6" fill="#0466c8"/>
    <text x="848" y="352" font-size="20" font-weight="700" fill="#fff">Ilias — azil.ma</text>
    <text x="848" y="376" font-size="12" fill="#8a93a4" letter-spacing="1">CUSTOM DESIGN</text>
    <circle cx="1075" cy="240" r="26" fill="none" stroke="#0466c8" stroke-width="2" opacity="0.6"/>
    <circle cx="1075" cy="240" r="16" fill="none" stroke="#0466c8" stroke-width="2" opacity="0.9"/>
  </g>
</svg>
